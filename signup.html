
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic Metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page description">

    <!-- Page Title -->
    <title>Page Title - MathWorld</title>

    <!-- Theme -->
    <script>
        (function () {
            const saved = localStorage.getItem("theme");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.dataset.theme =
                saved || (prefersDark ? "dark" : "light");
        })();
    </script>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

    <!-- BBCode -->
    <script defer src="bbcode.js"></script>

    <!-- Core JavaScript -->
    <script defer src="supabase-client.js"></script>
    <script defer src="layout.js"></script>
    <script defer src="auth-ui.js"></script>
    <script defer src="script.js"></script>

    <!-- Page JavaScript -->
    <script defer src="auth.js"></script>
</head>
<body>

    <div class="layout">

        <!-- Navigation -->
        <nav class="sidebar" id="sidebar"></nav>

        <!-- Main Content -->
        <main>
          <h1>Sign up</h1>
          <p>Create an account to save your own solutions.</p>

          <div class="auth-card">
            <form id="authForm">
              <label>Username
                <input type="text" id="username" autocomplete="username"
                      pattern="[A-Za-z0-9_]{3,30}" required>
                <span class="auth-hint">3 to 30 characters: letters, numbers, underscore. This name is public.</span>
              </label>
              <label>Email
                <input type="email" id="email" autocomplete="email" required>
              </label>
              <label>Password
                <input type="password" id="password" autocomplete="new-password" minlength="8" required>
                <span class="auth-hint">At least 8 characters.</span>
              </label>
              <label>Confirm password
                <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required>
              </label>
              <button type="submit" class="btn btn-primary">Create account</button>
            </form>

            <p id="message" class="auth-message" role="status"></p>
            <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
          </div>
        </main>

        <!-- Footer -->
        <footer class="site-footer" id="siteFooter"></footer>

    </div>

</body>
</html>
