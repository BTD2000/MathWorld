
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic Metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page description">

    <!-- Page Title -->
    <title>Page Title - MathWorld</title>

    <!-- Theme -->
    <script>
        (function () {
            const saved = localStorage.getItem("theme");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.dataset.theme =
                saved || (prefersDark ? "dark" : "light");
        })();
    </script>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

    <!-- BBCode -->
    <script defer src="bbcode.js"></script>

    <!-- Core JavaScript -->
    <script defer src="supabase-client.js"></script>
    <script defer src="layout.js"></script>
    <script defer src="auth-ui.js"></script>
    <script defer src="script.js"></script>

    <!-- Page JavaScript -->
    <script defer src="auth.js"></script>
</head>
<body>

    <div class="layout">

        <!-- Navigation -->
        <nav class="sidebar" id="sidebar"></nav>

        <!-- Main Content -->
        <main>
          <h1>Log in</h1>
          <p>Welcome back to MathWorld.</p>
          <div class="auth-card">
            <form id="authForm">
              <label>Email
                <input type="email" id="email" autocomplete="email" required>
              </label>
              <label>Password
                <input type="password" id="password" autocomplete="current-password" required>
              </label>
              <p>
                <button type="button" id="forgotPasswordButton" class="btn btn-small">Forgot password?</button>
              </p>
              <button type="submit" class="btn btn-primary">Log in</button>
            </form>
            <p id="message" class="auth-message" role="status"></p>
            <p class="auth-switch">No account yet? <a href="signup.html">Sign up</a></p>
          </div>
        </main>

        <!-- Footer -->
        <footer class="site-footer" id="siteFooter"></footer>

    </div>

</body>
</html>
