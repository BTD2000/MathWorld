
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic Metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page description">

    <!-- Page Title -->
    <title>Page Title - MathWorld</title>

    <!-- Theme -->
    <script>
        (function () {
            const saved = localStorage.getItem("theme");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.dataset.theme =
                saved || (prefersDark ? "dark" : "light");
        })();
    </script>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

    <!-- BBCode -->
    <script defer src="bbcode.js"></script>

    <!-- Core JavaScript -->
    <script defer src="supabase-client.js"></script>
    <script defer src="layout.js"></script>
    <script defer src="auth-ui.js"></script>
    <script defer src="script.js"></script>

    <!-- Page JavaScript -->
    <script defer src="update-password.js"></script>
</head>
<body>

    <div class="layout">

        <!-- Navigation -->
        <nav class="sidebar" id="sidebar"></nav>

        <!-- Main Content -->
        <main>
          <h1>Set a new password</h1>
          <p>Use the form below to choose a new password for your MathWorld account.</p>
          <div class="auth-card">
            <form id="updatePasswordForm">
              <label>New password
                <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required>
              </label>
              <label>Confirm new password
                <input type="password" id="confirmNewPassword" autocomplete="new-password" minlength="8" required>
              </label>
              <button type="submit" class="btn btn-primary">Save new password</button>
            </form>
            <p id="updatePasswordMessage" class="auth-message" role="status"></p>
            <p><a href="login.html">Back to login</a></p>
          </div>
        </main>

        <!-- Footer -->
        <footer class="site-footer" id="siteFooter"></footer>

    </div>

</body>
</html>
