<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home - MathWorld</title>

  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
    })();
  </script>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script defer src="supabase-client.js"></script>
  <script defer src="layout.js"></script>
  <script defer src="auth-ui.js"></script>
  <script defer src="script.js"></script>
  <script defer src="news.js"></script>
  <script defer src="statistics.js"></script>
</head>
<body>
  <div class="layout">

    <nav class="sidebar" id="sidebar"></nav>

    <main>
      <h1>Welcome to MathWorld</h1>

      <section class="home-section" id="latestNews">
        <div class="section-heading">
          <h2>Latest News</h2>
          <p>Stay updated with the latest news and announcements.</p>
        </div>

        <p id="newsStatus">Loading news...</p>
        <div id="newsList" class="news-list"></div>
      </section>

      <section class="home-section" id="statistics">
        <div class="section-heading">
          <h2>MathWorld Statistics</h2>
          <p>A look at our growing mathematical community.</p>
        </div>

        <p id="statsStatus">Loading statistics...</p>

        <div class="stats-grid">
          <div class="stat-card">
            <h3 id="problemCount">—</h3>
            <p>Problems</p>
          </div>

          <div class="stat-card">
            <h3 id="solutionCount">—</h3>
            <p>Solutions</p>
          </div>

          <div class="stat-card">
            <h3 id="memberCount">—</h3>
            <p>Members</p>
          </div>
        </div>
      </section>

    </main>

    <footer class="site-footer" id="siteFooter"></footer>

  </div>
</body>
</html>
