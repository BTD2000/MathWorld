
<!DOCTYPE html>
<!-- =====================================================
     PAGE: Contests
     PURPOSE: Display available MathWorld contests.
     ===================================================== -->
<html lang="en">
<head>
    <!-- =====================================================
         URL HELPER
         Keeps internal links rooted in this project folder.
         ===================================================== -->
<script>
        window.mwUrl = function (path) {
            return new URL(
                String(path).replace(/^\/+/, ""),
                document.baseURI
            ).href;
        };
    </script>

    <!-- =====================================================
         META
         ===================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Explore mathematics contests on MathWorld.">

    <title>Contests - MathWorld</title>

    <!-- =====================================================
         THEME
         ===================================================== -->
    <script>
        (function () {
            const saved = localStorage.getItem("theme");
            const prefersDark = window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches;

            document.documentElement.dataset.theme =
                saved || (prefersDark ? "dark" : "light");
        })();
    </script>

    <!-- =====================================================
         STYLESHEET
         ===================================================== -->
    <link rel="stylesheet" href="style.css">

    <!-- =====================================================
         SUPABASE
         ===================================================== -->
    <script
        defer
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js">
    </script>

    <!-- =====================================================
         CORE JAVASCRIPT
         ===================================================== -->
    <script defer src="supabase-client.js"></script>
    <script defer src="layout.js"></script>
    <script defer src="auth-ui.js"></script>
    <script defer src="script.js"></script>

    <!-- =====================================================
         PAGE JAVASCRIPT
         ===================================================== -->
    <script defer src="contests.js"></script>
</head>

<body>
    <div class="layout">

        <!-- =================================================
             SIDEBAR
             Generated by layout.js
             ================================================= -->
        <nav class="sidebar" id="sidebar"></nav>

        <!-- =================================================
             MAIN CONTENT
             ================================================= -->
        <main>

            <h1>Contests</h1>

            <p>
                Timed problem sets where you can test your
                mathematical skills against others.
            </p>

            <!-- =============================================
                 CONTEST LIST
                 Populated by contests.js
                 ============================================= -->
            <section id="contestsContainer">
                <p>Loading contests...</p>
            </section>

        </main>

        <!-- =================================================
             FOOTER
             Generated by layout.js
             ================================================= -->
        <footer class="site-footer" id="siteFooter"></footer>

    </div>
</body>
</html>
