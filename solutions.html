<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solutions - MathWorld</title>

  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
    })();
  </script>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="bbcode.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
  <script defer src="supabase-client.js"></script>
  <script defer src="layout.js"></script>
  <script defer src="auth-ui.js"></script>
  <script defer src="script.js"></script>
  <script defer src="solution-cards.js"></script>
  <script defer src="solutions.js"></script>
</head>
<body>
  <div class="layout">

    <nav class="sidebar" id="sidebar"></nav>

    <main>
      <h1>Solutions</h1>
      <p>Solutions that other people made public. Your own solutions are on your Account page.</p>

      <p id="statusLine"></p>
      <div id="solutionList"></div>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>

  </div>
</body>
</html>
