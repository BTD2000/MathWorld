
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic Metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page description">

    <!-- Page Title -->
    <title>Page Title - MathWorld</title>

    <!-- Theme -->
    <script>
        (function () {
            const saved = localStorage.getItem("theme");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.dataset.theme =
                saved || (prefersDark ? "dark" : "light");
        })();
    </script>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

    <!-- BBCode -->
    <script defer src="bbcode.js"></script>

    <!-- Core JavaScript -->
    <script defer src="supabase-client.js"></script>
    <script defer src="layout.js"></script>
    <script defer src="auth-ui.js"></script>
    <script defer src="script.js"></script>

    <!-- Page JavaScript -->
    <script defer src="profile.js"></script>
    <script defer src="solution-cards.js"></script>
</head>
<body>

    <div class="layout">

        <!-- Navigation -->
        <nav class="sidebar" id="sidebar"></nav>

        <!-- Main Content -->
        <main>
          <p class="account-eyebrow">MATHWORLD COMMUNITY</p>
          <h1>User Profile</h1>

          <p id="profileStatus">Loading profile...</p>

          <div id="profileContent" hidden>
            <section class="account-profile card">
              <div class="profile-avatar" aria-hidden="true">
                <span id="profileInitial">?</span>
              </div>

              <div class="profile-info">
                <p class="profile-label">MATHWORLD MEMBER</p>
                <h2 id="profileUsername"></h2>
                <p id="profileJoined" class="account-email"></p>
              </div>

              <span class="badge" id="profileRole">Member</span>
            </section>

            <section class="account-stats">
              <div class="stat-card">
                <span class="stat-label">Total Public Solutions</span>
                <strong id="publicSolutionCount">0</strong>
                <span class="stat-description">Shared with everyone</span>
              </div>
            </section>

            <section class="account-section">
              <div class="account-section-heading">
                <div>
                  <p class="section-eyebrow">MATHEMATICAL WORK</p>
                  <h2>Public Solutions</h2>
                </div>
              </div>

              <p id="solutionsStatus"></p>
              <div id="solutionList"></div>
            </section>
          </div>
        </main>

        <!-- Footer -->
        <footer class="site-footer" id="siteFooter"></footer>

    </div>

</body>
</html>
