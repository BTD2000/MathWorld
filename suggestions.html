
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Problem Suggestions - MathWorld</title>

  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      const prefersDark = window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;

      document.documentElement.dataset.theme =
        saved || (prefersDark ? "dark" : "light");
    })();
  </script>

  <link rel="stylesheet" href="style.css">

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script defer src="supabase-client.js"></script>
  <script defer src="layout.js"></script>
  <script defer src="auth-ui.js"></script>
  <script defer src="script.js"></script>
  <script defer src="suggestions.js"></script>
</head>

<body>
  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>

    <main>
      <h1>Problem Suggestions</h1>
      <p>Review, approve, or reject submitted problems.</p>

      <a href="admin.html" class="btn btn-small">← Admin Panel</a>

      <section class="admin-suggestions">
        <div id="suggestions-list">
          <p>Loading suggestions...</p>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>
  </div>
</body>
</html>
