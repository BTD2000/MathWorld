
<!DOCTYPE html>
<!-- =====================================================
     PAGE: Profile
     PURPOSE: Display a member's public profile and public solutions.
     ===================================================== -->
<html lang="en">
<head>
    <!--
    BASE PATH
    GitHub Pages project sites are served from /MathWorld/.
    Local development and custom domains are served from /.
    Keep this bootstrap before all local CSS and JavaScript references.
  -->
  <script>
    (function () {
      const isGitHubPages = window.location.hostname.endsWith("github.io");
      const basePath = isGitHubPages ? "/MathWorld/" : "/";
      const baseElement = document.createElement("base");
      baseElement.href = basePath;
      document.head.appendChild(baseElement);

      window.mwUrl = function (path) {
        return new URL(String(path).replace(/^\/+/, ""), baseElement.href).href;
      };
    })();
  </script>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | MathWorld</title>

  <script>
    (() => {
      const saved = localStorage.getItem("theme");
      const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme =
        saved || (systemDark ? "dark" : "light");
    })();
  </script>

  <link rel="stylesheet" href="assets/css/style.css">

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
  <script defer src="assets/js/core/supabase-client.js"></script>
  <script defer src="assets/js/core/layout.js"></script>
  <script defer src="assets/js/core/auth-ui.js"></script>
  <script defer src="assets/js/core/script.js"></script>
  <script defer src="assets/js/components/solution-cards.js"></script>
  <script defer src="assets/js/pages/profile.js"></script>
</head>

<body>
  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>

    <main class="account-main wide">
      <p class="account-eyebrow">MATHWORLD COMMUNITY</p>
      <h1>User Profile</h1>

      <p id="profileStatus">Loading profile...</p>

      <div id="profileContent" hidden>
        <section class="account-profile card">
          <div class="profile-avatar" aria-hidden="true">
            <span id="profileInitial">?</span>
          </div>

          <div class="profile-info">
            <p class="profile-label">MATHWORLD MEMBER</p>
            <h2 id="profileUsername"></h2>
            <p id="profileJoined" class="account-email"></p>
          </div>

          <span class="badge" id="profileRole">Member</span>
        </section>

        <section class="account-stats">
          <div class="stat-card">
            <span class="stat-label">Total Public Solutions</span>
            <strong id="publicSolutionCount">0</strong>
            <span class="stat-description">Shared with everyone</span>
          </div>
        </section>

        <section class="account-section">
          <div class="account-section-heading">
            <div>
              <p class="section-eyebrow">MATHEMATICAL WORK</p>
              <h2>Public Solutions</h2>
            </div>
          </div>

          <p id="solutionsStatus"></p>
          <div id="solutionList"></div>
        </section>
      </div>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>
  </div>
</body>
</html>
