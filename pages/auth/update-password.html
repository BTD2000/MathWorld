<!DOCTYPE html>
<!-- =====================================================
     PAGE: Update Password
     PURPOSE: Allow a user to set a new password after verification.
     ===================================================== -->
<html lang="en">
<head>
    <!--
    BASE PATH
    GitHub Pages project sites are served from /MathWorld/.
    Local development and custom domains are served from /.
    Keep this bootstrap before all local CSS and JavaScript references.
  -->
  <script>
    (function () {
      const isGitHubPages = window.location.hostname.endsWith("github.io");
      const basePath = isGitHubPages ? "/MathWorld/" : "/";
      const baseElement = document.createElement("base");
      baseElement.href = basePath;
      document.head.appendChild(baseElement);

      window.mwUrl = function (path) {
        return new URL(String(path).replace(/^\/+/, ""), baseElement.href).href;
      };
    })();
  </script>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set New Password - MathWorld</title>
  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script defer src="assets/js/core/supabase-client.js"></script>
  <script defer src="assets/js/core/layout.js"></script>
  <script defer src="assets/js/core/auth-ui.js"></script>
  <script defer src="assets/js/core/script.js"></script>
  <script defer src="assets/js/pages/update-password.js"></script>
</head>
<body>
  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main>
      <h1>Set a new password</h1>
      <p>Use the form below to choose a new password for your MathWorld account.</p>
      <div class="auth-card">
        <form id="updatePasswordForm">
          <label>New password
            <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required>
          </label>
          <label>Confirm new password
            <input type="password" id="confirmNewPassword" autocomplete="new-password" minlength="8" required>
          </label>
          <button type="submit" class="btn btn-primary">Save new password</button>
        </form>
        <p id="updatePasswordMessage" class="auth-message" role="status"></p>
        <p><a href="pages/auth/login.html">Back to login</a></p>
      </div>
    </main>
    <footer class="site-footer" id="siteFooter"></footer>
  </div>
</body>
</html>
