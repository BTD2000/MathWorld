<!DOCTYPE html>
<!-- =====================================================
     PAGE: Problems
     PURPOSE: Display the searchable and filterable problem archive.
     ===================================================== -->
<html lang="en">
<head>
    <!--
    BASE PATH
    GitHub Pages project sites are served from /MathWorld/.
    Local development and custom domains are served from /.
    Keep this bootstrap before all local CSS and JavaScript references.
  -->
  <script>
    (function () {
      const isGitHubPages = window.location.hostname.endsWith("github.io");
      const basePath = isGitHubPages ? "/MathWorld/" : "/";
      const baseElement = document.createElement("base");
      baseElement.href = basePath;
      document.head.appendChild(baseElement);

      window.mwUrl = function (path) {
        return new URL(String(path).replace(/^\/+/, ""), baseElement.href).href;
      };
    })();
  </script>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Problems - MathWorld</title>

  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
    })();
  </script>

  <link rel="stylesheet" href="assets/css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script defer src="assets/js/core/supabase-client.js"></script>
  <script defer src="assets/js/core/layout.js"></script>
  <script defer src="assets/js/core/auth-ui.js"></script>
  <script defer src="assets/js/core/script.js"></script>
  <script defer src="assets/js/pages/problems.js"></script>
</head>
<body>
  <div class="layout">

    <nav class="sidebar" id="sidebar"></nav>

    <main>
      <h1>Problems</h1>
      <p>Pick a problem and save your own solution.</p>

      <div id="problemAction"></div>

      <div class="filters">
        <label class="filter-field">
          Search
          <input type="search" id="searchInput" placeholder="Search by title">
        </label>

        <label class="filter-field">
          Topic
          <select id="topicSelect">
            <option value="">All topics</option>
          </select>
        </label>

        <div class="filter-field">
          Difficulty
          <div class="range-inputs">
            <input type="number" id="minDiff" min="1" max="14" placeholder="1" aria-label="Minimum difficulty">
            <span>to</span>
            <input type="number" id="maxDiff" min="1" max="14" placeholder="14" aria-label="Maximum difficulty">
          </div>
        </div>

        <button type="button" class="btn btn-small" id="clearFilters">Clear filters</button>
      </div>

      <div class="tag-filter" id="tagFilter" hidden></div>

      <p class="result-count" id="resultCount"></p>
      <p id="statusLine"></p>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th><button type="button" class="sort-btn" data-sort="id">#<span class="sort-arrow"></span></button></th>
              <th><button type="button" class="sort-btn" data-sort="title">Title<span class="sort-arrow"></span></button></th>
              <th><button type="button" class="sort-btn" data-sort="topic">Topic<span class="sort-arrow"></span></button></th>
              <th>Tags</th>
              <th><button type="button" class="sort-btn" data-sort="difficulty">Difficulty<span class="sort-arrow"></span></button></th>
            </tr>
          </thead>
          <tbody id="problemRows"></tbody>
        </table>
      </div>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>

  </div>
</body>
</html>
